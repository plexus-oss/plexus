# fly.toml app configuration file generated for plexus-alert-service on 2026-04-16T10:12:02-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'plexus-alert-service'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  ALERTD_ADDR = ':8081'
  ALERTD_MODE = 'prod'
  ALERTD_RULES_CACHE_PATH = '/var/cache/alert-service/rules-cache.json'
  LOG_LEVEL = 'info'

[[mounts]]
  source = 'alert_cache'
  destination = '/var/cache/alert-service'

[[services]]
  protocol = 'tcp'
  internal_port = 8081
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  [[services.ports]]
    port = 8081
    handlers = []

  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/livez'
    protocol = 'http'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512

[[metrics]]
  port = 9091
  path = '/metrics'
