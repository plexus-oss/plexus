app = 'plexus-data-api'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  GATEWAY_URL = 'ws://plexus-gateway.internal:8080'
  REDIS_URL = 'redis://plexus-gateway-redis.internal:6379'
  CLICKHOUSE_HOST = 'plexus-ch.internal'
  CLICKHOUSE_PORT = '8123'
  CLICKHOUSE_SECURE = 'false'
  CLICKHOUSE_DATABASE = 'plexus'
  CLICKHOUSE_USER = 'telemetry_writer'

[[services]]
  protocol = 'tcp'
  internal_port = 8000
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 500

  [[services.tcp_checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '15s'

  [[services.http_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'get'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '2048mb'
  cpu_kind = 'performance'
  cpus = 1
