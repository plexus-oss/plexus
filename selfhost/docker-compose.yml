# Plexus self-host bundle — the entire platform in one compose stack.
#
# Layout assumption: the five repos are cloned side by side and this file
# lives at <root>/gateway/selfhost/docker-compose.yml (install.sh sets that
# up). All secrets/config come from the .env file install.sh generates next
# to this file.
#
#   docker compose --env-file .env up -d --build
#
# Boot order: postgres → migrate → clickhouse (keeper + schema) → valkey →
# frontend → gateway / loader / houston / api. Houston and the loader retry
# until the frontend answers; that's expected on first boot.

name: plexus

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: plexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: plexus
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plexus -d plexus"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies drizzle migrations with the same image the app runs.
  migrate:
    image: ghcr.io/plexus-oss/plexus/frontend:${PLEXUS_VERSION:-latest}
    build: &frontend-build
      context: ../frontend
      args:
        NEXT_PUBLIC_APP_URL: ${PLEXUS_APP_URL}
        NEXT_PUBLIC_GATEWAY_HOST: ${PLEXUS_GATEWAY_PUBLIC_HOST}
        NEXT_PUBLIC_BILLING_ENABLED: "false"
    command: ["node", "migrate-runner.cjs"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://plexus:${POSTGRES_PASSWORD}@postgres:5432/plexus
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine # BSD-3; Redis ≥7.4 is RSALv2/SSPL and can't ship in this bundle
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--dir", "/data"]
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ch-keeper:
    image: clickhouse/clickhouse-keeper:26.3.3.20-alpine
    hostname: ch-keeper # config.xml resolves this name
    restart: unless-stopped
    volumes:
      - ../clickhouse/server/configs/keeper/keeper_config.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper_data:/var/lib/clickhouse-keeper

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.3.20
    hostname: ch-01 # cluster + macros in config.xml expect this name
    restart: unless-stopped
    depends_on:
      - ch-keeper
      - minio-init
    volumes:
      - ../clickhouse/server/configs/clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      - ../clickhouse/server/configs/clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ../clickhouse/server/configs/clickhouse/disks.xml:/etc/clickhouse-server/config.d/disks.xml:ro
      - ch_data:/var/lib/clickhouse
      - ch_logs:/var/log/clickhouse-server
    environment:
      CH_REPLICATION_SECRET: ${CH_REPLICATION_SECRET}
      CH_PASSWORD: ${CH_WRITER_PASSWORD}
      # users.xml auth (from_env password hashes — generated by install.sh)
      CH_WRITER_PASSWORD_SHA256: ${CH_WRITER_PASSWORD_SHA256}
      CH_READER_PASSWORD_SHA256: ${CH_READER_PASSWORD_SHA256}
      CH_ADMIN_PASSWORD_SHA256: ${CH_ADMIN_PASSWORD_SHA256}
      # Cold/backup tiers land in the bundled MinIO (schema uses the
      # 'tiered' storage policy, so these are required).
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CLICKHOUSE_S3_COLD_ENDPOINT: http://minio:9000/plexus-cold/
      CLICKHOUSE_S3_BACKUP_ENDPOINT: http://minio:9000/plexus-backup/
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # One-shot: applies the reference DDL once ClickHouse answers.
  ch-init:
    image: clickhouse/clickhouse-server:26.3.3.20
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ../clickhouse/server/schema.sql:/schema.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - clickhouse-client --host ch-01 --user admin --password "$$CH_ADMIN_PASSWORD" --multiquery < /schema.sql
    environment:
      CH_ADMIN_PASSWORD: ${CH_ADMIN_PASSWORD}

  minio:
    image: minio/minio
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb -p local/plexus-cold local/plexus-backup local/plexus-assets
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  frontend:
    image: ghcr.io/plexus-oss/plexus/frontend:${PLEXUS_VERSION:-latest}
    build: *frontend-build
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://plexus:${POSTGRES_PASSWORD}@postgres:5432/plexus
      AUTH_SECRET: ${AUTH_SECRET}
      PLEXUS_INTERNAL_SECRET: ${PLEXUS_INTERNAL_SECRET}
      PLEXUS_CLICKHOUSE_URL: http://ch-01:8123
      PLEXUS_CLICKHOUSE_USER: nextjs_reader
      PLEXUS_CLICKHOUSE_PASSWORD: ${CH_READER_PASSWORD}
      PLEXUS_CLICKHOUSE_DATABASE: plexus
      PLEXUS_GATEWAY_URL: http://gateway:8080
      PLEXUS_ALERT_SERVICE_URL: http://houston:8081
      PLEXUS_LOADER_URL: http://ch-loader:8080
      BILLING_ENABLED: "false"
      ENCRYPTION_KEYS: ${ENCRYPTION_KEYS}
      ENCRYPTION_KEY_CURRENT: v1
      # Optional integrations — blank means the feature stays quiet.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_ADDRESS: ${RESEND_FROM_ADDRESS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Enterprise license key (optional; missing = free tier, silently).
      PLEXUS_LICENSE: ${PLEXUS_LICENSE:-}
      # Icon/context uploads land in the bundled MinIO.
      TIGRIS_ENDPOINT: http://minio:9000
      TIGRIS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      TIGRIS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      TIGRIS_BUCKET_ICONS: plexus-assets
      TIGRIS_BUCKET_CONTEXT: plexus-assets
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

  gateway:
    image: ghcr.io/plexus-oss/plexus/gateway:${PLEXUS_VERSION:-latest}
    build:
      context: ../gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      GATEWAY_MODE: prod
      REDIS_URL: valkey:6379 # gateway wants bare host:port
      PLEXUS_API_URL: http://frontend:3000
      PLEXUS_INTERNAL_SECRET: ${PLEXUS_INTERNAL_SECRET}
      GATEWAY_ALLOWED_ORIGINS: ${GATEWAY_ALLOWED_ORIGINS}
      GATEWAY_INSTANCE_ID: gateway-1
    depends_on:
      valkey:
        condition: service_healthy

  ch-loader:
    image: ghcr.io/plexus-oss/plexus/ch-loader:${PLEXUS_VERSION:-latest}
    build:
      context: ../clickhouse/loader
    restart: unless-stopped
    environment:
      REDIS_URL: redis://valkey:6379 # loader wants a URL
      CH_HOST: ch-01
      CH_PORT: "8123"
      CH_USER: telemetry_writer
      CH_PASSWORD: ${CH_WRITER_PASSWORD}
      PLEXUS_API_URL: http://frontend:3000
      PLEXUS_INTERNAL_SECRET: ${PLEXUS_INTERNAL_SECRET}
      CONSUMER_NAME: loader-1
    depends_on:
      valkey:
        condition: service_healthy
      ch-init:
        condition: service_completed_successfully

  houston:
    image: ghcr.io/plexus-oss/plexus/houston:${PLEXUS_VERSION:-latest}
    build:
      context: ../houston
    restart: unless-stopped
    environment:
      ALERTD_MODE: prod
      REDIS_URL: valkey:6379 # bare host:port, like the gateway
      PLEXUS_API_URL: http://frontend:3000
      PLEXUS_INTERNAL_SECRET: ${PLEXUS_INTERNAL_SECRET}
      ALERTD_RULES_CACHE_PATH: /var/cache/alert-service/rules-cache.json
      ALERTD_CONSUMER_NAME: alerts-1
    volumes:
      - houston_cache:/var/cache/alert-service
    depends_on:
      valkey:
        condition: service_healthy

  api:
    image: ghcr.io/plexus-oss/plexus/api:${PLEXUS_VERSION:-latest}
    build:
      context: ../api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://plexus:${POSTGRES_PASSWORD}@postgres:5432/plexus
      REDIS_URL: redis://valkey:6379
      CLICKHOUSE_HOST: ch-01
      CLICKHOUSE_PORT: "8123" # clickhouse_connect speaks HTTP
      CLICKHOUSE_DATABASE: plexus
      CLICKHOUSE_USER: nextjs_reader
      CLICKHOUSE_PASSWORD: ${CH_READER_PASSWORD}
      GATEWAY_URL: ws://gateway:8080
      INTERNAL_SECRET: ${PLEXUS_INTERNAL_SECRET}
      APP_URL: ${PLEXUS_APP_URL}
    depends_on:
      valkey:
        condition: service_healthy
      ch-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  valkey_data:
  keeper_data:
  ch_data:
  ch_logs:
  minio_data:
  houston_cache:
