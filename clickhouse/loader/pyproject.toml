[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ch-loader"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.8",
    "aiohttp>=3.9",
    "redis>=5.0",
    "orjson>=3.10",
    "httpx>=0.27",
    "zstandard>=0.23",
    "prometheus_client>=0.21",
]

[tool.setuptools]
py-modules = ["loader"]
