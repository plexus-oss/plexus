name: ci

# Deterministic gates: lint + typecheck. Fast, free, 100% reliable — these
# hard-block. Anything requiring judgment lives in the (separate) LLM rubric.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tsc --noEmit catches type errors without a full build. If the project
      # starts depending on Next's generated route types (.next/types), add a
      # `npx next typegen` (or `npm run build`) step before this.
      - run: npx tsc --noEmit

  # Hermetic DB integration tests: an ephemeral Postgres, migrated from scratch
  # by lib/db/__tests__/setup.ts and truncated per test. Doubles as the Postgres
  # "schema applies from scratch" check and exercises the lib/db/queries CRUD
  # paths against the migration-built schema (catches schema/query drift).
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # setup.ts creates plexus_test via the admin `postgres` db, then migrates it.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plexus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
