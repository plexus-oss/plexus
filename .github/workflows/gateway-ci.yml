name: gateway-ci

# Deterministic gates for the gateway: gofmt + vet + build + race tests, plus
# the //go:build integration suite against a real Redis.

on:
  pull_request:
    paths: ["gateway/**"]
  push:
    branches: [main]
    paths: ["gateway/**"]

concurrency:
  group: gateway-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: gateway

jobs:
  test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod # stays in sync with the toolchain in go.mod
          cache-dependency-path: gateway/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd — run 'gofmt -w .':"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # -race because the gateway is concurrency-heavy (per-conn goroutines,
      # the pull-flow, the OrgReader poll/flush split). The default (untagged)
      # build excludes integration tests, so no Redis is needed here.
      - name: test
        run: go test -race ./...

  integration:
    name: integration (redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 2s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum

      # Runs the //go:build integration tests (real Redis at localhost:6379)
      # alongside the unit tests.
      - name: integration test
        run: go test -tags integration ./...
