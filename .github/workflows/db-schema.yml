name: db-schema

# Fails the build when frontend/lib/db/schema.ts has drifted ahead of the
# committed Drizzle migrations — i.e. someone changed the schema (often via
# `drizzle-kit push`) without running `npm run db:generate` and committing the
# result. Migration-built databases (fresh envs, prod release_command, the
# self-host migrate one-shot) would silently be missing those columns; this
# catches it at PR time instead.

on:
  pull_request:
    paths:
      - "frontend/lib/db/schema.ts"
      - "frontend/lib/db/migrations/**"
      - "frontend/drizzle.config.ts"
  push:
    branches: [main]
    paths:
      - "frontend/lib/db/schema.ts"
      - "frontend/lib/db/migrations/**"
      - "frontend/drizzle.config.ts"

defaults:
  run:
    working-directory: frontend

jobs:
  migrations-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: schema.ts must have a committed migration
        env:
          # drizzle-kit generate is offline (diffs schema.ts against the
          # snapshot, no DB connection). drizzle.config.ts still references
          # DATABASE_URL, so a dummy value satisfies it.
          DATABASE_URL: postgresql://u:p@localhost:5432/db
        run: |
          npx drizzle-kit generate --name ci_drift_check
          if [ -n "$(git status --porcelain lib/db/migrations)" ]; then
            echo "::error::schema.ts has changes with no committed migration. Run 'npm run db:generate' locally and commit the generated files."
            git --no-pager diff -- lib/db/migrations
            exit 1
          fi
          echo "✓ migrations are in sync with schema.ts"
