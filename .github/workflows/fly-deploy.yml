name: fly-deploy

# Auto-deploy the frontend to Plexus Cloud (plexus-frontend on Fly) whenever
# `ci` passes on main. Cloud rides main; self-hosters ride version tags
# (release-images) — a deploy here never changes what self-hosters run.
# FLY_API_TOKEN is a deploy token scoped to the plexus-frontend app.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

# Queue (not cancel) overlapping deploys — cancelling flyctl mid-rollout can
# leave machines on mixed versions.
concurrency:
  group: fly-deploy-prod

jobs:
  deploy:
    # ci also runs on pull_request; only deploy for push-to-main runs that passed.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Deploy the exact commit CI validated, not whatever main points at now.
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --config fly.toml
        working-directory: frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
